name: quotezia
description: "Quotezia - Your daily inspiration app"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  google_mobile_ads: ^5.1.0
  flutter_local_notifications: ^17.2.2
  share_plus: ^9.0.0
  in_app_purchase: ^3.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  url_launcher: ^6.2.5
  flutter_animate: ^4.5.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#5B2C6F"
  adaptive_icon_foreground: "assets/icon/app_icon_android.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#5B2C6F"
  image: "assets/splash/splash_logo.png"
  color_dark: "#2C1338"
  image_dark: "assets/splash/splash_logo.png"
  android_12:
    color: "#5B2C6F"
    icon_background_color: "#5B2C6F"
    image: "assets/splash/splash_logo.png"
    color_dark: "#2C1338"
    icon_background_color_dark: "#2C1338"
    image_dark: "assets/splash/splash_logo.png"
  ios: true
  android: true
  web: true

flutter:
  uses-material-design: true

  # Assets
  # assets:
  #   - assets/images/
  #   - assets/data/

  # Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
